# nginx snippet — routes /api/iosdist/* + /iosdist/* (public OTA +
# share/plaza) to iosdist-svc (:8091). Pair with POLAR_IOSDIST_REMOTE=true
# in dock env at cutover time.
#
# Drop BEFORE the general /api + / blocks in your vhost.
#
# Includes /api/agent/* for the polar-agent iOS build callback because
# the dock-side handler set today uses /api/iosdist/agent/builds/*
# under the same module ownership.

location ~ ^/api/iosdist/ {
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    # IPA upload + signed IPA download can be 200+ MB
    client_max_body_size 500m;
    proxy_read_timeout 1200s;
    proxy_send_timeout 1200s;
    proxy_request_buffering off;
}

location ~ ^/iosdist/ {
    # Public OTA install page (manifest.plist), share page, plaza —
    # unauthenticated, token-gated server-side.
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
}
